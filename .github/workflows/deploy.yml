name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  ansible-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conectar el runner a Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:continuous-integration

      - name: Instalar Ansible
        run: pip install ansible

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ejecutar playbook
        run: |
          ansible-playbook -i inventory/hosts.yml playbooks/add-configuration/create-folder-test.yml \
            -u "${{ secrets.SSH_USER }}" \
            --private-key ~/.ssh/deploy_key \
            -e "ansible_host=${{ secrets.SSH_HOST }}"
