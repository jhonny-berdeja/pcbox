---
- name: Uninstall microk8s
  hosts: pcbox-server-prod
  become: true
  gather_facts: false

  tasks:
    - name: Check if microk8s snap is installed
      ansible.builtin.command: snap list microk8s
      register: microk8s_snap_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Remove microk8s snap (purge, no recovery snapshot)
      ansible.builtin.command: snap remove --purge microk8s
      when: microk8s_snap_check.rc == 0
      changed_when: true

    - name: Remove any leftover microk8s data directory
      ansible.builtin.file:
        path: /var/snap/microk8s
        state: absent

    - name: Remove the microk8s group (also drops jhon's membership)
      ansible.builtin.group:
        name: microk8s
        state: absent
